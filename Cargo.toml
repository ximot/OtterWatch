[package]
name = "otterwatch"
version = "0.0.5"
authors = ["Tomasz Wyderka <twyderka@me.com>"]
description = "Application for monitoring the performance of the Linux operating system"
repository = "https://github.com/ximot/OtterWatch"
readme = "README.md"
rust-version = "1.68.2"
edition = "2021"
homepage = "https://github.com/ximot/OtterWatch"
license = "MIT"

[dependencies]
crossterm = "0.27"
libc = "0.2"
actix-web = "4.8.0"
actix-cors = "0.7.0"
actix-files = "0.6.6"
rusqlite = { version = "0.31.0", features = ["bundled"] }
tokio = { version = "1.39.2", features = ["full"] }
config = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.121"
once_cell = "1.19.0"
chrono = "0.4.38"
regex = "1.10.5"
log = "0.4.22"
toml = "0.8.16"
time = "0.3.36"
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/otterwatch", dest = "/usr/bin/otterwatch", mode = "744" },
    { source = "target/release/Settings.toml", dest = "/etc/otterwatch/Settings.toml", mode = "644" },
]
